spring.application.name=eam

# Load local overrides from src/.env if present
spring.config.import=optional:file:src/.env[.properties]

# Set active profile (oracle / sql)
# spring.profiles.active=${SPRING_PROFILES_ACTIVE}

server.port=${SERVER_PORT}

# Log at INFO for everything
logging.level.root=INFO
app.logging.path=${APP_LOG_PATH:logs}

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/v3/api-docs
server.forward-headers-strategy=framework

# Log more details for your app package
logging.level.com.example.sqlserver.config.RequestResponseLoggingFilter=DEBUG

# Mail
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# Invite + frontend URLs
app.invite.accept-url=${APP_INVITE_ACCEPT_URL}
app.frontend.set-password-url=${APP_FRONTEND_SET_PASSWORD_URL}

# Database Configuration (from environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM}

# CORS (comma-separated HTTP origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://54.225.63.207:4300,http://54.225.63.207:4200,http://54.225.63.207}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.ngrok-free.app,http://*.ngrok-free.app}

# MFA
app.mfa.app-name=${APP_MFA_APP_NAME:MERVIN-EAM}
app.mfa.token-expiration-ms=${APP_MFA_TOKEN_EXPIRATION_MS:300000}
app.mfa.rate-limit.max-attempts=${APP_MFA_RATE_LIMIT_MAX_ATTEMPTS:5}
app.mfa.rate-limit.window-seconds=${APP_MFA_RATE_LIMIT_WINDOW_SECONDS:300}
app.mfa.encryption-key=${APP_MFA_ENCRYPTION_KEY:change-me-change-me-change-me-change-me-123456}
app.mfa.qr-size=${APP_MFA_QR_SIZE:240}
app.mfa.email-otp-expiry-minutes=${APP_MFA_EMAIL_OTP_EXPIRY_MINUTES:5}

# Flyway (migrations)

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
logging.level.org.flywaydb=DEBUG

