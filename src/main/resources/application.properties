spring.application.name=eam

# Set active profile (oracle / sql)
spring.profiles.active=sql
# Load local overrides from src/.env if present
spring.config.import=optional:file:src/.env[.properties]

# Log at INFO for everything
logging.level.root=INFO

# application.properties
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/v3/api-docs
server.forward-headers-strategy=framework

# Log more details for your app package (includes the filter)
logging.level.com.example.sqlserver.config.RequestResponseLoggingFilter=DEBUG

# Mail (override via environment variables SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# Invite + frontend URLs
app.invite.accept-url=${APP_INVITE_ACCEPT_URL:http://localhost:8080/users/accept}
app.frontend.set-password-url=${APP_FRONTEND_SET_PASSWORD_URL:http://localhost:4200/set-password}
